<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto" data-applied="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="情绪练习：思维记录、呼吸空间和每日打卡。记录只保存在这台设备上。">
  <meta name="theme-color" content="#f3efe6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="情绪练习">
  <title>情绪练习</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("mood-practice:settings") || "{}");
        var theme = saved.theme === "light" || saved.theme === "dark" ? saved.theme : "auto";
        var dark = theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.applied = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#1a1815" : "#f3efe6");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="offline-banner" class="offline-banner" hidden>现在没有网络。练习和已经记下的内容仍可使用。</div>
  <div id="app"><p class="loading">正在打开…</p></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal" hidden></div>
  <noscript><p class="loading">需要打开 JavaScript。打开之后，记录也只留在这台设备上。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
